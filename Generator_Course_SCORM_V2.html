<script>
const RT="/* SCORM RUNTIME (1.2 + 2004) and quiz engine */\nvar SCORM=(function(){\n var api=null,ver=null,init=false,st={c:false,s:null},t0=Date.now();\n function find(w){var n=0;while(w&&n++<10){if(w.API_1484_11){ver='2004';return w.API_1484_11}if(w.API){ver='1.2';return w.API}if(w.parent&&w.parent!==w)w=w.parent;else break}return null}\n function K(a,b){return ver=='2004'?a:b}\n function sv(k,v){if(!init)return;try{ver=='2004'?api.SetValue(k,String(v)):api.LMSSetValue(k,String(v))}catch(e){}}\n function gv(k){if(!init)return'';try{return ver=='2004'?api.GetValue(k):api.LMSGetValue(k)}catch(e){return''}}\n function cm(){if(!init)return;try{ver=='2004'?api.Commit(''):api.LMSCommit('')}catch(e){}}\n function push(){if(ver=='2004'){sv('cmi.completion_status',st.c?'completed':'incomplete');if(st.s!==null)sv('cmi.success_status',st.s?'passed':'failed')}else sv('cmi.core.lesson_status',st.s!==null?(st.s?'passed':'failed'):(st.c?'completed':'incomplete'));cm()}\n return{\n  connect:function(){api=find(window)||(window.opener?find(window.opener):null);if(!api)return false;init=(ver=='2004'?api.Initialize(''):api.LMSInitialize(''))=='true';return init},\n  get connected(){return init},\n  load:function(){var cs=gv(K('cmi.completion_status','cmi.core.lesson_status')),ss=ver=='2004'?gv('cmi.success_status'):cs,o={};\n   st.c=cs=='completed'||cs=='passed'||cs=='failed';if(ss=='passed')st.s=true;else if(ss=='failed')st.s=false;\n   try{o=JSON.parse(gv('cmi.suspend_data'))||{}}catch(e){}push();return{loc:parseInt(gv(K('cmi.location','cmi.core.lesson_location')),10),sd:o}},\n  save:function(loc,sd){sv(K('cmi.location','cmi.core.lesson_location'),loc);sv('cmi.suspend_data',JSON.stringify(sd).slice(0,3900));cm()},\n  complete:function(){if(!st.c){st.c=true;push()}},\n  success:function(ok){st.s=ok;push()},\n  score:function(raw,max){if(ver=='2004'){sv('cmi.score.raw',raw);sv('cmi.score.min',0);sv('cmi.score.max',max);sv('cmi.score.scaled',Math.round(raw/max*10000)/10000)}else{sv('cmi.core.score.raw',Math.round(raw/max*100));sv('cmi.core.score.min',0);sv('cmi.core.score.max',100)}cm()},\n  inter:function(i,id,type,resp,ok,corr){var p='cmi.interactions.'+i+'.';sv(p+'id',id);sv(p+'type',type);sv(p+'correct_responses.0.pattern',corr);if(ver=='2004'){sv(p+'learner_response',resp);sv(p+'result',ok?'correct':'incorrect')}else{sv(p+'student_response',resp);sv(p+'result',ok?'correct':'wrong')}},\n  obj:function(i,id,sc,ok){var p='cmi.objectives.'+i+'.';sv(p+'id',id);if(ver=='2004'){sv(p+'score.scaled',sc);sv(p+'success_status',ok?'passed':'failed')}else{sv(p+'score.raw',Math.round(sc*100));sv(p+'status',ok?'passed':'failed')}},\n  terminate:function(){if(!init)return;var s=Math.round((Date.now()-t0)/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60,p=function(n){return n<10?'0'+n:''+n};\n   if(ver=='2004'){sv('cmi.session_time','PT'+h+'H'+m+'M'+x+'S');sv('cmi.exit',st.c?'normal':'suspend');cm();api.Terminate('')}else{sv('cmi.core.session_time',p(h)+':'+p(m)+':'+p(x));sv('cmi.core.exit',st.c?'':'suspend');cm();api.LMSFinish('')}init=false}\n };\n})();\n(function(){\n var tries=0,Q=function(s,c){return [].slice.call((c||document).querySelectorAll(s))};\n function norm(s){return String(s).trim().toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'')}\n function G(it){var t=it.dataset.type,q=it.dataset.qid,a=JSON.parse(it.dataset.ans||'null'),r={answered:false,ok:false,resp:'',corr:'',fb:'',ty:'choice'};\n  if(t=='single'||t=='tf'){var s=it.querySelector('input[name=\"'+q+'\"]:checked');r.ty=t=='tf'?'true-false':'choice';r.corr=a;if(s){r.answered=true;r.resp=s.value;r.ok=s.value==a;r.fb=s.dataset.fb||''}}\n  else if(t=='multi'){var c=Q('input:checked',it);r.corr=a.join('[,]');r.resp=c.map(function(x){return x.value}).join('[,]');r.answered=c.length>0;r.ok=c.map(function(x){return x.value}).sort().join()==a.slice().sort().join();r.fb=c.map(function(x){return x.dataset.fb}).filter(Boolean).join(' ')}\n  else if(t=='text'){var v=it.querySelector('.qin').value;r.ty='fill-in';r.answered=!!v.trim();r.resp=v;r.corr=a[0]||'';r.ok=a.some(function(x){return norm(x)==norm(v)})}\n  else if(t=='num'){var w=it.querySelector('.qin').value,x=parseFloat(String(w).replace(',','.'));r.ty='numeric';r.answered=!!w.trim();r.resp=isNaN(x)?'':x;r.corr=(a.v-a.t)+'[:]'+(a.v+a.t);r.ok=!isNaN(x)&&Math.abs(x-a.v)<=a.t+1e-9}\n  else{var S=Q('select',it);r.answered=S.every(function(s){return s.value});\n   if(t=='order'){r.ty='sequencing';r.resp=S.slice().sort(function(m,n){return m.value-n.value}).map(function(s){return 'i'+s.dataset.i}).join('[,]');r.corr=S.slice().sort(function(m,n){return m.dataset.i-n.dataset.i}).map(function(s){return 'i'+s.dataset.i}).join('[,]')}\n   else{r.ty='matching';r.resp=S.map(function(s){return 'l'+s.dataset.i+'[.]r'+s.value}).join('[,]');r.corr=S.slice().sort(function(m,n){return m.dataset.i-n.dataset.i}).map(function(s){return 'l'+s.dataset.i+'[.]r'+s.dataset.i}).join('[,]')}\n   r.ok=r.answered&&S.every(function(s){return s.value==s.dataset.i})}\n  return r}\n function show(it,r){var f=document.getElementById(it.dataset.qid+'-feedback');f.className='quiz-feedback '+(r.ok?'ok':'ko');f.textContent=(r.ok?M.okp:M.kop)+(r.fb?r.fb+' ':'')+(it.getAttribute('data-explain')||'')}\n function shuf(el,sel){var c=[].slice.call(sel?el.options:el.children).slice(sel?1:0);for(var i=c.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=c[i];c[i]=c[j];c[j]=t}c.forEach(function(x){(sel?el:el).appendChild(x)})}\n window.__qp=!document.querySelector('.quiz-item[data-qid]');\n function chk(){var vis=(done.size+(cur>0&&!done.has(cur)?1:0))>=TOTAL,q=window.__qp,ok=CFG.crit=='visit'?vis:CFG.crit=='quiz'?q:(vis&&q);if(ok)SCORM.complete()}\n window.RTsave=function(){SCORM.save(cur,{d:Array.from(done),t:tries});chk()};\n Q('.quiz-item[data-type]').forEach(function(it){var t=it.dataset.type,o=it.querySelector('.quiz-options');\n  if(o&&((CFG.shuffle&&(t=='single'||t=='multi'))||t=='order'))shuf(o);\n  if(t=='match')Q('select',it).forEach(function(s){shuf(s,true)})});\n if(CFG.sum)Q('.quiz-check[data-target]').forEach(function(b){b.style.display='none'});\n Q('.quiz-check[data-target]').forEach(function(b){b.addEventListener('click',function(){var it=document.querySelector('.quiz-item[data-qid=\"'+b.getAttribute('data-target')+'\"]'),r=G(it);\n  if(!r.answered){var f=document.getElementById(it.dataset.qid+'-feedback');f.className='quiz-feedback ko';f.textContent=M.sel;return}show(it,r)})});\n var sub=document.getElementById('quiz-submit');\n if(sub)sub.addEventListener('click',function(){var out=document.getElementById('quiz-score'),oo=document.getElementById('quiz-obj'),its=Q('.quiz-item[data-qid]');out.className='quiz-feedback';\n  if(CFG.att&&tries>=CFG.att){out.textContent=M.att;out.classList.add('ko');return}\n  var rs=its.map(G),an=rs.filter(function(r){return r.answered}).length;\n  if(an<its.length){out.textContent=M.a1+an+'/'+its.length+M.a2;out.classList.add('ko');return}\n  tries++;var sc=rs.filter(function(r){return r.ok}).length,pct=Math.round(sc/its.length*100),ps=pct>=CFG.pass,ob={},ol=[];\n  its.forEach(function(it,i){show(it,rs[i]);var o=it.dataset.obj;if(o){ob[o]=ob[o]||[0,0];ob[o][1]++;if(rs[i].ok)ob[o][0]++}});\n  Object.keys(ob).forEach(function(k,j){var s=ob[k][0]/ob[k][1],ok=s>=CFG.pass/100;ol.push(k+' '+(ok?'✔':'✘')+' ('+Math.round(s*100)+'%)');SCORM.obj(j,k,Math.round(s*10000)/10000,ok)});\n  if(oo)oo.textContent=ol.length?M.obj+' : '+ol.join(' · '):'';\n  out.textContent=M.sc+sc+'/'+its.length+' ('+pct+'%) — '+(ps?M.pass:M.fail);out.classList.add(ps?'ok':'ko');\n  its.forEach(function(it,i){SCORM.inter(i,it.dataset.qid,rs[i].ty,rs[i].resp,rs[i].ok,rs[i].corr)});\n  SCORM.score(sc,its.length);SCORM.success(ps);window.__qp=ps;window.RTsave()});\n window.addEventListener('load',function(){if(SCORM.connect()){var s=SCORM.load();(s.sd.d||[]).forEach(function(x){done.add(x)});tries=s.sd.t||0;if(s.loc>0&&s.loc<=TOTAL)go(s.loc);else window.RTsave()}});\n window.addEventListener('beforeunload',function(){SCORM.terminate()});\n})();\nvar fz=100;function fs(d){fz=Math.max(80,Math.min(160,fz+d*10));document.body.style.zoom=fz/100}\n", CSS="\n/* ═══════════════════════════════════════════\n   DESIGN SYSTEM\n═══════════════════════════════════════════ */\n:root{\n  --w:#0f766e;--w-dk:#134e4a;--w-lt:#f0fdfa;--w-md:#14b8a6;\n  --amber:#f59e0b;--amber-dk:#92400e;--amber-lt:#fffbeb;\n  --blue:#1d4ed8;--blue-lt:#eff6ff;\n  --grn:#15803d;--grn-lt:#f0fdf4;\n  --red:#b91c1c;--red-lt:#fef2f2;\n  --pur:#7c3aed;--pur-lt:#f5f3ff;\n  --bg:#f8fafc;--white:#ffffff;\n  --text:#0f172a;--text-lt:#64748b;--border:#e2e8f0;\n  --code:#0f2027;\n  --sidebar-w:320px;--header-h:64px;--r:10px;\n  --sh:0 2px 10px rgba(0,0,0,.08);--sh-md:0 6px 20px rgba(0,0,0,.12);\n}\n*,::before,::after{margin:0;padding:0;box-sizing:border-box;}\nhtml{scroll-behavior:smooth;font-size:16px;}\nbody{font-family:'Outfit',sans-serif;line-height:1.80;color:var(--text);background:var(--bg);}\ncode,pre{font-family:'Fira Code',monospace;}\ncode{font-size:.85em;background:#e0f2fe;color:#0c4a6e;padding:2px 6px;border-radius:4px;white-space:nowrap;}\nstrong{font-weight:700;}\na{color:var(--w);}\n\n/* ── HEADER ── */\n#lms-header{\n  position:fixed;top:0;left:0;right:0;height:var(--header-h);z-index:1000;\n  background:linear-gradient(105deg,#0f2027 0%,#1e3a8a 55%,#0f2027 100%);\n  color:#fff;display:flex;align-items:center;justify-content:space-between;\n  padding:0 28px;box-shadow:0 3px 14px rgba(0,0,0,.45);\n}\n.hdr-logo{\n  width:48px;height:48px;border-radius:12px;flex-shrink:0;\n  background:linear-gradient(135deg,var(--w-md),var(--w));\n  display:flex;align-items:center;justify-content:center;\n  font-family:'Fira Code',monospace;font-weight:700;font-size:.78em;\n  color:#fff;text-align:center;line-height:1.2;\n}\n.hdr-text{margin-left:14px;}\n.hdr-text .sub{font-size:.68em;letter-spacing:1.4px;text-transform:uppercase;opacity:.8;font-weight:400;}\n.hdr-text .tit{font-size:1.05em;font-weight:700;letter-spacing:-.2px;}\n.hdr-right{text-align:right;font-size:.78em;opacity:.82;}\n.hdr-right strong{display:block;font-size:1.05em;}\n\n/* ── PROGRESS BAR ── */\n#prog-wrap{position:fixed;top:var(--header-h);left:0;right:0;z-index:999;height:4px;background:rgba(255,255,255,.12);}\n#prog-bar{height:100%;width:0%;background:linear-gradient(90deg,var(--w-md),var(--amber),var(--w-md));transition:width .45s;}\n\n/* ── SIDEBAR ── */\n#course-nav{\n  position:fixed;top:calc(var(--header-h) + 4px);left:0;width:var(--sidebar-w);\n  height:calc(100vh - var(--header-h) - 4px);background:var(--white);\n  border-right:1px solid var(--border);overflow-y:auto;z-index:900;padding:12px 0 70px;\n}\n#course-nav::-webkit-scrollbar{width:4px;}\n#course-nav::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px;}\n.nav-chapter{padding:14px 18px 4px;font-size:.65em;font-weight:700;text-transform:uppercase;\n  letter-spacing:1.8px;color:var(--text-lt);}\n.nav-gr{\n  display:flex;align-items:center;gap:9px;padding:8px 16px;\n  cursor:pointer;font-size:.85em;color:var(--text);\n  border-left:3px solid transparent;transition:all .2s;\n}\n.nav-gr:hover{background:var(--blue-lt);color:var(--blue);}\n.nav-gr.active{background:var(--blue-lt);border-left-color:var(--blue);color:#1e3a8a;font-weight:600;}\n.nav-gr.done .gnum{background:var(--grn)!important;}\n.gnum{\n  min-width:24px;height:24px;border-radius:50%;\n  background:var(--blue);color:#fff;font-size:.7em;font-weight:700;\n  display:flex;align-items:center;justify-content:center;flex-shrink:0;\n}\n.gnum.sub{background:#94a3b8;color:#fff;font-size:.62em;}\n.gnum.final{background:var(--pur);}\n#nav-toggle{\n  display:none;position:fixed;bottom:80px;left:16px;z-index:1001;\n  background:var(--blue);color:#fff;border:none;border-radius:50%;\n  width:48px;height:48px;font-size:1.3em;cursor:pointer;box-shadow:var(--sh-md);font-weight:700;\n}\n\n/* ── MAIN ── */\n#main{\n  margin-left:var(--sidebar-w);margin-top:calc(var(--header-h) + 4px);\n  padding:36px 52px 130px;min-height:calc(100vh - var(--header-h) - 4px);\n}\n\n/* ── GRAINS ── */\n.grain{display:none;animation:grainIn .3s ease;}\n.grain.active{display:block;}\n@keyframes grainIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}\n\n/* ── BREADCRUMB & HEADER ── */\n.bc{font-size:.76em;color:var(--text-lt);margin-bottom:18px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}\n.bc span{color:var(--blue);font-weight:600;}\n.gh{padding-bottom:18px;margin-bottom:28px;border-bottom:3px solid;}\n.gh.g-core{border-color:var(--blue);}\n.gh.g-math{border-color:var(--w);}\n.gh.g-adv{border-color:var(--amber);}\n.gh.g-quiz{border-color:var(--pur);}\n.gn-lbl{display:inline-block;font-size:.68em;font-weight:700;text-transform:uppercase;\n  letter-spacing:1.6px;padding:3px 12px;border-radius:20px;margin-bottom:8px;color:#fff;}\n.g-title{font-size:1.85em;font-weight:800;line-height:1.2;letter-spacing:-.5px;}\n.g-sub{font-size:1em;color:var(--text-lt);margin-top:6px;font-weight:400;}\n\n/* ── BODY & TYPOGRAPHY ── */\n.gb{max-width:900px;}\n.gb p{margin-bottom:1em;}\n.gb ul,.gb ol{margin:.5em 0 1.2em 1.7em;}\n.gb li{margin-bottom:.4em;}\n.gb h3{\n  font-size:1.15em;font-weight:700;color:#1e3a8a;\n  margin:1.8em 0 .6em;padding-left:12px;\n  border-left:4px solid var(--amber);\n}\n.gb h4{font-size:1em;font-weight:700;margin:1.2em 0 .4em;color:var(--text);}\n\n/* ── SCORM / OPALE BLOCKS ── */\n.bo,.bc2,.br,.be,.bw,.bt{\n  border-radius:0 var(--r) var(--r) 0;padding:16px 20px;margin:20px 0;border-left:5px solid;\n}\n.bo{background:#eff6ff;border-color:#1d4ed8;} /* Definition / Objectif */\n.bc2{background:var(--amber-lt);border-color:var(--amber);} /* Warning / Remarque */\n.br{background:var(--grn-lt);border-color:var(--grn);} /* Important */\n.be{background:var(--pur-lt);border-color:var(--pur);} /* Example */\n.bw{background:var(--w-lt);border-color:var(--w);} /* Concept */\n.blbl{\n  font-size:.7em;font-weight:700;text-transform:uppercase;\n  letter-spacing:1.3px;margin-bottom:8px;display:flex;align-items:center;gap:6px;\n}\n.bo .blbl{color:#1d4ed8;}.bc2 .blbl{color:var(--amber-dk);}\n.br .blbl{color:var(--grn);}.be .blbl{color:var(--pur);}\n.bw .blbl{color:var(--w-dk);}\n\n/* ── QUIZ ── */\n.bq{background:#fff;border:2px solid var(--pur);border-radius:var(--r);padding:22px 24px;margin:28px 0;}\n.bq .blbl{color:var(--pur);}\n.qq{font-weight:700;margin-bottom:13px;line-height:1.55;font-size:1em;}\n.qopts{display:flex;flex-direction:column;gap:8px;}\n.qopt{\n  display:flex;align-items:flex-start;gap:10px;padding:10px 14px;\n  border:1.5px solid var(--border);border-radius:8px;cursor:pointer;\n  transition:all .2s;background:#fafbfc;font-size:.93em;user-select:none;\n}\n.qopt:hover{border-color:var(--blue);background:var(--blue-lt);}\n.qopt.correct{background:var(--grn-lt);border-color:var(--grn);color:#14532d;font-weight:600;}\n.qopt.wrong{background:var(--red-lt);border-color:var(--red);color:var(--red);}\n.qopt.selected{border-color:var(--blue);background:var(--blue-lt);}\n.qopt.selected .qrad{border-color:var(--blue);background:var(--blue);box-shadow:inset 0 0 0 3px #fff;}\n.qopt.dimmed{opacity:.35;pointer-events:none;}\n.qrad{min-width:18px;height:18px;border-radius:50%;border:2px solid #bbb;flex-shrink:0;margin-top:2px;}\n.qfb{margin-top:12px;padding:10px 14px;border-radius:8px;font-size:.9em;display:none;}\n.qfb.show{display:block;}\n.qfb.ok{background:var(--grn-lt);color:var(--grn);border:1.5px solid var(--grn);}\n.qfb.ko{background:var(--red-lt);color:var(--red);border:1.5px solid var(--red);}\n.btn-chk{\n  margin-top:14px;padding:9px 22px;background:var(--pur);color:#fff;border:none;\n  border-radius:8px;cursor:pointer;font-size:.9em;font-weight:600;\n  font-family:'Outfit',sans-serif;transition:all .2s;\n}\n.btn-chk:hover{background:#6d28d9;}.btn-chk:disabled{background:#94a3b8;cursor:default;}\n\n/* ── CODE BLOCKS ── */\n.cw{border-radius:var(--r);overflow:hidden; kground:#dbeafe;}\n.quiz-feedback{margin-top:6px;font-size:0.9rem;}\n.quiz-feedback.ok{color:var(--grn);}\n.quiz-feedback.ko{color:var(--red);}\n\n", JS1="\n/* ══════ NAVIGATION LOGIC ══════ */\nconst TOTAL = 12; \nlet cur = 0;\nconst done = new Set();\nconst labels = [\n  'Chapter Overview',\n  '1 – Why Complexity Matters',\n  '1.1 – Asymptotic Notations',\n  '1.2 – Cases (Best/Worst/Avg)',\n  '1.3 – Time vs. Space',\n  '2 – Common Complexity Classes',\n  '2.1 – The Master Theorem',\n  '2.2 – Multi-Language Implement.',\n  '3 – Amortized Analysis',\n  '3.1 – Space Complexity of Recursion',\n  '3.2 – P vs NP Classes',\n  'Summary & References',\n  'Final Quiz'\n];\n\nfunction go(n) {\n  document.getElementById('g-' + cur)?.classList.remove('active');\n  document.querySelectorAll('.nav-gr').forEach(e => e.classList.remove('active'));\n  if (cur > 0) done.add(cur);\n  cur = n;\n  document.getElementById('g-' + n)?.classList.add('active');\n  const ng = document.querySelector('[data-gr=\"' + n + '\"]');\n  if (ng) { ng.classList.add('active'); ng.scrollIntoView({block: 'nearest'}); }\n  document.querySelectorAll('.nav-gr').forEach(e => { if (done.has(+e.dataset.gr)) e.classList.add('done'); });\n  updateNav(); updateProg(); window.scrollTo(0,0);\n  document.getElementById('course-nav').classList.remove('open');\n}\n\nfunction next() { if (cur < TOTAL) go(cur + 1); }\nfunction prev() { if (cur > 0) go(cur - 1); }\n\nfunction updateNav() {\n  document.getElementById('bp').disabled = cur === 0;\n  const nb = document.getElementById('bnx');\n  nb.disabled = cur === TOTAL;\n  nb.textContent = cur === TOTAL ? '✓ Completed' : 'Next ▶';\n  document.getElementById('navpos').textContent = labels[cur] || '';\n}\n\nfunction updateProg() {\n  document.getElementById('prog-bar').style.width = cur === 0 ? '0%' : Math.round(cur / TOTAL * 100) + '%';\n}\n\n/* ══════ TABS LOGIC ══════ */\nfunction tabShow(group, id, btn) {\n  document.querySelectorAll('[id^=\"' + group + '-\"]').forEach function crc(b){let t=crc.t;if(!t){t=crc.t=[];for(let n=0,c;n<256;n++){c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}}let r=-1;for(let i=0;i<b.length;i++)r=t[(r^b[i])&255]^(r>>>8);return(r^-1)>>>0}
function zip(files){const en=new TextEncoder(),P=[],C=[];let off=0,cs=0;
 for(const[n,d]of files){const nb=en.encode(n),db=en.encode(d),c=crc(db),h=new DataView(new ArrayBuffer(30));
  h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint32(14,c,true);h.setUint32(18,db.length,true);h.setUint32(22,db.length,true);h.setUint16(26,nb.length,true);P.push(h.buffer,nb,db);
  const g=new DataView(new ArrayBuffer(46));g.setUint32(0,0x02014b50,true);g.setUint16(4,20,true);g.setUint16(6,20,true);g.setUint16(8,0x0800,true);g.setUint32(16,c,true);g.setUint32(20,db.length,true);g.setUint32(24,db.length,true);g.setUint16(28,nb.length,true);g.setUint32(42,off,true);C.push(g.buffer,nb);cs+=46+nb.length;off+=30+nb.length+db.length}
 const z=new DataView(new ArrayBuffer(22));z.setUint32(0,0x06054b50,true);z.setUint16(8,files.length,true);z.setUint16(10,files.length,true);z.setUint32(12,cs,true);z.setUint32(16,off,true);
 return new Blob([...P,...C,z.buffer],{type:'application/zip'})}
