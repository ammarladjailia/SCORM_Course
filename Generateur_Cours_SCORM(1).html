<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Arial,sans-serif;background:#f1f5f9;color:#0f172a}

<script>
const CSS="\n/* ═══════════════════════════════════════════\n   DESIGN SYSTEM\n═══════════════════════════════════════════ */\n:root{\n  --w:#0f766e;--w-dk:#134e4a;--w-lt:#f0fdfa;--w-md:#14b8a6;\n  --amber:#f59e0b;--amber-dk:#92400e;--amber-lt:#fffbeb;\n  --blue:#1d4ed8;--blue-lt:#eff6ff;\n  --grn:#15803d;--grn-lt:#f0fdf4;\n  --red:#b91c1c;--red-lt:#fef2f2;\n  --pur:#7c3aed;--pur-lt:#f5f3ff;\n  --bg:#f8fafc;--white:#ffffff;\n  --text:#0f172a;--text-lt:#64748b;--border:#e2e8f0;\n  --code:#0f2027;\n  --sidebar-w:320px;--header-h:64px;--r:10px;\n  --sh:0 2px 10px rgba(0,0,0,.08);--sh-md:0 6px 20px rgba(0,0,0,.12);\n}\n*,::before,::after{margin:0;padding:0;box-sizing:border-box;}\nhtml{scroll-behavior:smooth;font-size:16px;}\nbody{font-family:'Outfit',sans-serif;line-height:1.80;color:var(--text);background:var(--bg);}\ncode,pre{font-family:'Fira Code',monospace;}\ncode{font-size:.85em;background:#e0f2fe;color:#0c4a6e;padding:2px 6px;border-radius:4px;white-space:nowrap;}\nstrong{font-weight:700;}\na{color:var(--w);}\n\n/* ── HEADER ── */\n#lms-header{\n  position:fixed;top:0;left:0;right:0;height:var(--header-h);z-index:1000;\n  background:linear-gradient(105deg,#0f2027 0%,#1e3a8a 55%,#0f2027 100%);\n  color:#fff;display:flex;align-items:center;justify-content:space-between;\n  padding:0 28px;box-shadow:0 3px 14px rgba(0,0,0,.45);\n}\n.hdr-logo{\n  width:48px;height:48px;border-radius:12px;flex-shrink:0;\n  background:linear-gradient(135deg,var(--w-md),var(--w));\n  display:flex;align-items:center;justify-content:center;\n  font-family:'Fira Code',monospace;font-weight:700;font-size:.78em;\n  color:#fff;text-align:center;line-height:1.2;\n}\n.hdr-text{margin-left:14px;}\n.hdr-text .sub{font-size:.68em;letter-spacing:1.4px;text-transform:uppercase;opacity:.8;font-weight:400;}\n.hdr-text .tit{font-size:1.05em;font-weight:700;letter-spacing:-.2px;}\n.hdr-right{text-align:right;font-size:.78em;opacity:.82;}\n.hdr-right strong{display:block;font-size:1.05em;}\n\n/* ── PROGRESS BAR ── */\n#prog-wrap{position:fixed;top:var(--header-h);left:0;right:0;z-index:999;height:4px;background:rgba(255,255,255,.12);}\n#prog-bar{height:100%;width:0%;background:linear-gradient(90deg,var(--w-md),var(--amber),var(--w-md));transition:width .45s;}\n\n/* ── SIDEBAR ── */\n#course-nav{\n  position:fixed;top:calc(var(--header-h) + 4px);left:0;width:var(--sidebar-w);\n  height:calc(100vh - var(--header-h) - 4px);background:var(--white);\n  border-right:1px solid var(--border);overflow-y:auto;z-index:900;padding:12px 0 70px;\n}\n#course-nav::-webkit-scrollbar{width:4px;}\n#course-nav::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px;}\n.nav-chapter{padding:14px 18px 4px;font-size:.65em;font-weight:700;text-transform:uppercase;\n  letter-spacing:1.8px;color:var(--text-lt);}\n.nav-gr{\n  display:flex;align-items:center;gap:9px;padding:8px 16px;\n  cursor:pointer;font-size:.85em;color:var(--text);\n  border-left:3px solid transparent;transition:all .2s;\n}\n.nav-gr:hover{background:var(--blue-lt);color:var(--blue);}\n.nav-gr.active{background:var(--blue-lt);border-left-color:var(--blue);color:#1e3a8a;font-weight:600;}\n.nav-gr.done .gnum{background:var(--grn)!important;}\n.gnum{\n  min-width:24px;height:24px;border-radius:50%;\n  background:var(--blue);color:#fff;font-size:.7em;font-weight:700;\n  display:flex;align-items:center;justify-content:center;flex-shrink:0;\n}\n.gnum.sub{background:#94a3b8;color:#fff;font-size:.62em;}\n.gnum.final{background:var(--pur);}\n#nav-toggle{\n  display:none;position:fixed;bottom:80px;left:16px;z-index:1001;\n  background:var(--blue);color:#fff;border:none;border-radius:50%;\n  width:48px;height:48px;font-size:1.3em;cursor:pointer;box-shadow:var(--sh-md);font-weight:700;\n}\n\n/* ── MAIN ── */\n#main{\n  margin-left:var(--sidebar-w);margin-top:calc(var(--header-h) + 4px);\n  padding:36px 52px 130px;min-height:calc(100vh - var(--header-h) - 4px);\n}\n\n/* ── GRAINS ── */\n.grain{display:none;animation:grainIn .3s ease;}\n.grain.active{display:block;}\n@keyframes grainIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}\n\n/* ── BREADCRUMB & HEADER ── */\n.bc{font-size:.76em;color:var(--text-lt);margin-bottom:18px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}\n.bc span{color:var(--blue);font-weight:600;}\n.gh{padding-bottom:18px;margin-bottom:28px;border-bottom:3px solid;}\n.gh.g-core{border-color:var(--blue);}\n.gh.g-math{border-color:var(--w);}\n.gh.g-adv{border-color:var(--amber);}\n.gh.g-quiz{border-color:var(--pur);}\n.gn-lbl{display:inline-block;font-size:.68em;font-weight:700;text-transform:uppercase;\n  letter-spacing:1.6px;padding:3px 12px;border-radius:20px;margin-bottom:8px;color:#fff;}\n.g-title{font-size:1.85em;font-weight:800;line-height:1.2;letter-spacing:-.5px;}\n.g-sub{font-size:1em;color:var(--text-lt);margin-top:6px;font-weight:400;}\n\n/* ── BODY & TYPOGRAPHY ── */\n.gb{max-width:900px;}\n.gb p{margin-bottom:1em;}\n.gb ul,.gb ol{margin:.5em 0 1.2em 1.7em;}\n.gb li{margin-bottom:.4em;}\n.gb h3{\n  font-size:1.15em;font-weight:700;color:#1e3a8a;\n  margin:1.8em 0 .6em;padding-left:12px;\n  border-left:4px solid var(--amber);\n}\n.gb h4{font-size:1em;font-weight:700;margin:1.2em 0 .4em;color:var(--text);}\n\n/* ── SCORM / OPALE BLOCKS ── */\n.bo,.bc2,.br,.be,.bw,.bt{\n  border-radius:0 var(--r) var(--r) 0;padding:16px 20px;margin:20px 0;border-left:5px solid;\n}\n.bo{background:#eff6ff;border-color:#1d4ed8;} /* Definition / Objectif */\n.bc2{background:var(--amber-lt);border-color:var(--amber);} /* Warning / Remarque */\n.br{background:var(--grn-lt);border-color:var(--grn);} /* Important */\n.be{background:var(--pur-lt);border-color:var(--pur);} /* Example */\n.bw{background:var(--w-lt);border-color:var(--w);} /* Concept */\n.blbl{\n  font-size:.7em;font-weight:700;text-transform:uppercase;\n  letter-spacing:1.3px;margin-bottom:8px;display:flex;align-items:center;gap:6px;\n}\n.bo .blbl{color:#1d4ed8;}.bc2 .blbl{color:var(--amber-dk);}\n.br .blbl{color:var(--grn);}.be .blbl{color:var(--pur);}\n.bw .blbl{color:var(--w-dk);}\n\n/* ── QUIZ ── */\n.bq{background:#fff;border:2px solid var(--pur);border-radius:var(--r);padding:22px 24px;margin:28px 0;}\n.bq .blbl{color:var(--pur);}\n.qq{font-weight:700;margin-bottom:13px;line-height:1.55;font-size:1em;}\n.qopts{display:flex;flex-direction:column;gap:8px;}\n.qopt{\n  display:flex;align-items:flex-start;gap:10px;padding:10px 14px;\n  border:1.5px solid var(--border);border-radius:8px;cursor:pointer;\n  transition:all .2s;background:#fafbfc;font-size:.93em;user-select:none;\n}\n.qopt:hover{border-color:var(--blue);background:var(--blue-lt);}\n.qopt.correct{background:var(--grn-lt);border-color:var(--grn);color:#14532d;font-weight:600;}\n.qopt.wrong{background:var(--red-lt);border-color:var(--red);color:var(--red);}\n.qopt.selected{border-color:var(--blue);background:var(--blue-lt);}\n.qopt.selected .qrad{border-color:var(--blue);background:var(--blue);box-shadow:inset 0 0 0 3px #fff;}\n.qopt.dimmed{opacity:.35;pointer-events:none;}\n.qrad{min-width:18px;height:18px;border-radius:50%;border:2px solid #bbb;flex-shrink:0;margin-top:2px;}\n.qfb{margin-top:12px;padding:10px 14px;border-radius:8px;font-size:.9em;display:none;}\n.qfb.show{display:block;}\n.qfb.ok{background:var(--grn-lt);color:var(--grn);border:1.5px solid var(--grn);}\n.qfb.ko{background:var(--red-lt);color:var(--red);border:1.5px solid var(--red);}\n.btn-chk{\n  margin-top:14px;padding:9px 22px;background:var(--pur);color:#fff;border:none;\n  border-radius:8px;cursor:pointer;font-size:.9em;font-weight:600;\n  font-family:'Outfit',sans-serif;transition:all .2s;\n}\n.btn-chk:hover{background:#6d28d9;}.btn-chk:disabled{background:#94a3b8;cursor:default;}\n\n/* ── CODE BLOCKS ── */\n.cw{border-radius:var(--r);overflow:hidden;margin:14px 0;box-shadow:var(--sh);}\n.ctb{\n  background:#1e293b;color:#94a3b8;padding:8px 16px;\n  font-size:.68em;font-weight:600;text-transform:uppercase;letter-spacing:.9px;\n  display:flex;justify-content:space-between;align-items:center;\n}\n.cb{\n  background:var(--code);color:#e2e8f0;padding:18px 20px;\n  overflow-x:auto;white-space:pre;font-family:'Fira Code',monospace;\n  font-size:.84em;line-height:1.72;\n}\n/* Syntax tokens */\n.t-k{color:#f472b6;}   /* keyword */\n.t-s{color:#86efac;}   /* string */\n.t-n{color:#93c5fd;}   /* number / type */\n.t-c{color:#475569;font-style:italic;}  /* comment */\n.t-f{color:#fcd34d;}   /* function */\n.t-o{color:#fb923c;}   /* operator */\n\n/* ── TABS ── */\n.tab-bar{display:flex;gap:4px;margin-bottom:0;flex-wrap:wrap;}\n.tab-btn{\n  padding:10px 20px;border:1px solid var(--border);background:#f8fafc;\n  border-radius:8px 8px 0 0;cursor:pointer;font-size:.85em;font-weight:600;\n  font-family:'Outfit',sans-serif;transition:all .2s;color:var(--text-lt);\n}\n.tab-btn:hover{background:#e2e8f0;}\n.tab-btn.active{background:#1e293b;color:#fff;border-color:#1e293b;}\n.tab-pane{display:none;border:1px solid var(--border);border-radius:0 var(--r) var(--r) var(--r);\n  background:var(--code);margin-bottom:16px;overflow:hidden;}\n.tab-pane.active{display:block;}\n.tab-pane .cb{margin:0;border-radius:0;}\n\n/* ── INTERACTIVE ── */\n.rb{\n  border:1.5px solid var(--border);border-top:3px dashed var(--w);\n  padding:20px;background:#fff;border-radius:0 0 var(--r) var(--r);\n  margin-bottom:20px;position:relative;\n}\n.rb::before{\n  content:\"⚡ Interactive Analysis\";position:absolute;top:-13px;left:16px;\n  background:var(--w);color:#fff;padding:2px 12px;\n  border-radius:20px;font-size:.66em;font-weight:700;\n}\n.btn-reveal{\n  padding:9px 20px;border:none;border-radius:8px;cursor:pointer;\n  font-size:.88em;font-weight:600;font-family:'Outfit',sans-serif;\n  background:var(--w);color:#fff;transition:all .2s;\n}\n.btn-reveal:hover{background:var(--w-dk);}\n.reveal-content{\n  margin-top:14px;padding:14px;background:var(--w-lt);\n  border-left:4px solid var(--w);border-radius:4px;display:none;\n}\n\n/* ── TABLES ── */\n.tbl{width:100%;border-collapse:collapse;font-size:.89em;margin:14px 0;box-shadow:var(--sh);}\n.tbl th{background:#1e3a8a;color:#fff;padding:10px 14px;text-align:left;font-weight:600;}\n.tbl td{padding:9px 14px;border:1px solid var(--border);line-height:1.5;}\n.tbl tr:nth-child(even) td{background:#f8fafc;}\n.tbl tr:hover td{background:var(--blue-lt);}\n\n/* ── GRID CARDS ── */\n.card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:16px 0;}\n.card{border-radius:var(--r);padding:18px;border:1.5px solid var(--border);background:#fff;transition:transform .2s,box-shadow .2s;}\n.card:hover{transform:translateY(-3px);box-shadow:var(--sh-md);border-color:var(--w-md);}\n.card h4{font-size:.95em;font-weight:700;margin-bottom:8px;color:#1e3a8a;}\n.card p{font-size:.86em;line-height:1.5;margin:0;}\n\n/* ── DIAGRAMS (P vs NP) ── */\n.euler-diagram {\n  display: flex; justify-content: center; align-items: center; margin: 30px 0;\n}\n.circle-np {\n  width: 300px; height: 300px; border-radius: 50%; background: #e0e7ff; \n  border: 3px solid #6366f1; display: flex; flex-direction: column; \n  align-items: center; position: relative; box-shadow: var(--sh);\n}\n.circle-p {\n  width: 140px; height: 140px; border-radius: 50%; background: #dcfce7;\n  border: 3px solid #22c55e; display: flex; justify-content: center; \n  align-items: center; position: absolute; bottom: 20px; font-weight: 700; color: #166534;\n}\n.circle-npc {\n  width: 140px; height: 140px; border-radius: 50%; background: #fee2e2;\n  border: 3px solid #ef4444; display: flex; justify-content: center; \n  align-items: center; position: absolute; top: 20px; font-weight: 700; color: #991b1b; text-align: center;\n}\n\n/* ── COVER / HOME ── */\n.cover{\n  min-height:calc(100vh - var(--header-h) - 4px - 70px);\n  display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;\n  padding:40px 20px;\n}\n.cv-chapter-tag{\n  display:inline-block;background:var(--w-lt);color:var(--w-dk);border:1px solid var(--w);\n  font-size:.8em;font-weight:700;text-transform:uppercase;letter-spacing:1.6px;\n  padding:6px 18px;border-radius:20px;margin-bottom:16px;\n}\n.cv-icon{font-size:4.5em;margin-bottom:10px;line-height:1;}\n.cv-title{font-size:2.8em;font-weight:800;color:#1e3a8a;line-height:1.15;margin-bottom:8px;letter-spacing:-.8px;}\n.cv-sub{font-size:1.05em;color:var(--text-lt);margin-bottom:30px;max-width:650px;}\n.cv-chips{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-bottom:28px;}\n.cv-chip{background:#fff;border:1.5px solid var(--border);border-radius:10px;padding:8px 16px;font-size:.86em;}\n.cv-chip strong{display:block;font-size:.68em;color:var(--blue);text-transform:uppercase;letter-spacing:.8px;margin-bottom:2px;}\n.btn-start{\n  margin-top:24px;padding:14px 46px;font-family:'Outfit',sans-serif;\n  background:linear-gradient(90deg,#1e3a8a,var(--w));color:#fff;\n  border:none;border-radius:10px;font-size:1.06em;font-weight:700;\n  cursor:pointer;box-shadow:0 4px 18px rgba(30,58,138,.35);transition:all .22s;\n}\n.btn-start:hover{transform:translateY(-2px);box-shadow:0 8px 26px rgba(30,58,138,.4);}\n\n/* ── BOTTOM NAV ── */\n#bot-nav{\n  position:fixed;bottom:0;left:var(--sidebar-w);right:0;height:62px;\n  background:var(--white);border-top:1px solid var(--border);\n  display:flex;align-items:center;justify-content:space-between;padding:0 32px;z-index:900;\n}\n.bn{display:flex;align-items:center;gap:7px;padding:10px 24px;border:none;border-radius:8px;font-size:.9em;font-weight:600;cursor:pointer;transition:all .2s;font-family:'Outfit',sans-serif;}\n.bp{background:var(--blue-lt);color:var(--blue);}.bp:hover{background:#dbeafe;}.bp:disabled{opacity:.3;cursor:default;}\n.bnx{background:linear-gradient(90deg,#1e3a8a,var(--w));color:#fff;}\n.bnx:hover{opacity:.9;}.bnx:disabled{background:var(--grn);cursor:default;}\n.nav-pos{font-size:.78em;color:var(--text-lt);text-align:center;max-width:260px;}\n\n/* RESPONSIVE */\n@media(max-width:880px){\n  #course-nav{transform:translateX(-100%);transition:.3s;}\n  #course-nav.open{transform:translateX(0);}\n  #main{margin-left:0;padding:22px 16px 120px;}\n  #bot-nav{left:0;}\n  #nav-toggle{display:flex;align-items:center;justify-content:center;}\n}\n\n.obj-table{width:100%;border-collapse:collapse;margin-top:18px;margin-bottom:8px;font-size:0.95rem;background:var(--white);border-radius:12px;overflow:hidden;box-shadow:var(--sh);}\n.obj-table thead{background:var(--amber-lt);}\n.obj-table th,.obj-table td{padding:10px 12px;border-bottom:1px solid var(--border);text-align:left;}\n.obj-table th{font-weight:600;color:var(--amber-dk);}\n.obj-table tbody tr:nth-child(even){background:#f9fafb;}\n.obj-table tbody tr:last-child td{border-bottom:none;}\n.sequence-label{display:inline-block;padding:6px 10px;border-radius:999px;background:var(--blue-lt);color:var(--blue);font-size:0.8rem;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:10px;}\n\n.quiz-block{margin-top:24px;display:grid;gap:18px;background:var(--white);border-radius:18px;padding:18px 20px;box-shadow:var(--sh-md);border:1px solid var(--border);}\n.quiz-item{border-radius:14px;padding:14px 16px;background:#f9fafb;border:1px solid #e5e7eb;}\n.quiz-item h3{margin-bottom:6px;font-size:1rem;}\n.quiz-stem{margin-bottom:10px;color:var(--text-lt);}\n.quiz-options{display:grid;gap:6px;margin-bottom:10px;}\n.quiz-options label{display:flex;align-items:flex-start;gap:6px;font-size:0.95rem;cursor:pointer;}\n.quiz-options input[type=\"radio\"]{margin-top:3px;}\n.quiz-check{align-self:start;padding:6px 14px;border-radius:999px;border:1px solid var(--blue);background:var(--blue-lt);color:var(--blue);font-size:0.85rem;font-weight:600;cursor:pointer;}\n.quiz-check:hover{background:#dbeafe;}\n.quiz-feedback{margin-top:6px;font-size:0.9rem;}\n.quiz-feedback.ok{color:var(--grn);}\n.quiz-feedback.ko{color:var(--red);}\n\n", JS1="\n/* ══════ NA
